quarkus.application.name=sus-agenda
quarkus.jackson.fail-on-unknown-properties=true
quarkus.jackson.write-dates-as-timestamps=false
quarkus.log.console.format=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5p [%c{2.}] (%t) requestId=%X{requestId} %s%e%n
sus-agenda.time-zone=America/Sao_Paulo
sus-agenda.slot-duration-minutes=60
sus-agenda.business-day-start=07:00
sus-agenda.business-day-end=20:00
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.always-include=true
sus-agenda.auth.enabled=true
sus-agenda.persistence=${PERSISTENCE:memory}
sus-agenda.notification.sender=${NOTIFICATION_SENDER:log}
